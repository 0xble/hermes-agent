name: Repository nightly
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-nightly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    name: Native OS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Fixed images, not -latest aliases: a GitHub label move must arrive as
        # a reviewed change, not as a surprise nightly failure.
        os: [windows-2025-vs2026]
    env:
      OPENROUTER_API_KEY: ''
      OPENAI_API_KEY: ''
      NOUS_API_KEY: ''
      # rustup's default in the runner HOME is not visible to the isolated CI HOME.
      # Keep the pinned toolchain in checkout-owned ignored state across both steps.
      RUSTUP_HOME: ${{ github.workspace }}/.ci/rustup
    steps:
      - name: Keep Windows checkout LF under isolated Git config
        if: matrix.os == 'windows-2025-vs2026'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert scheduled or dispatched SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ github.sha }}'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Launcher only: uv installs the exact checkout interpreter below.
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.8.2'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: '0.12.13'
      - name: Install pinned checkout Python
        shell: bash
        run: uv python install 3.14.7
      - name: Initialize Windows MSVC linker for Rust builds
        if: matrix.os == 'windows-2025-vs2026'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install pinned Rust for ripgrep provisioning
        shell: bash
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Dump runner environment
        shell: bash
        run: python -c "import json,os; open(os.path.join(os.environ['RUNNER_TEMP'],'runner-env.json'),'w',encoding='utf-8').write(json.dumps(dict(os.environ)))"; echo "RUNNER_TEMP=$RUNNER_TEMP"
      - name: Qualify native OS at exact SHA
        shell: bash
        run: |
          # Windows PowerShell fixture startup competes with other test-file
          # processes for the hosted runner's two cores. Run Windows files
          # serially so a stalled launcher is not mistaken for a pipe leak or
          # a UI timeout; preserve the existing macOS file concurrency.
          ./bin/ci nightly-native '${{ github.sha }}' --workers 1
      - name: Worker diagnostics
        if: always()
        shell: bash
        run: cat "$RUNNER_TEMP/diag-worker.jsonl" || true
