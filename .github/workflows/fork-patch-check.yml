name: Fork patch check

# Enforces the Fork-Patch trailer contract that MAINTENANCE.md describes.
#
# The rule landed in #47 as a client-side commit-msg hook, which cannot hold: a
# squash merge composes its message on GitHub, where no local hook runs. #48
# merged one commit later carrying no trailer, and nothing objected until a
# person ran the script by hand. That commit has since been repaired in #55 via
# the documented Fork-Patch-Backfill route, so this is not chasing an open
# failure -- it closes the hole that let it land and stay unnoticed.
#
# scripts/check_fork_patches.py already implements the check. It was referenced
# by no workflow, so the contract was documented and enforced only by whoever
# remembered to run it.
#
# --source-only because the script's other assertions (installed extensions,
# profile config, update receipt) describe a live install, which a runner is
# not. Those stay a post-promotion check, run from the installed checkout.
#
# fetch-depth: 0 because the check walks every commit above the trailer floor
# and requires that floor to be an ancestor of HEAD; a shallow clone cannot
# see it and the script fails for the wrong reason.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fork-patch-check:
    name: Fork-Patch trailers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Check Fork-Patch trailers and unit ownership
        run: python scripts/check_fork_patches.py --repo . --source-only
