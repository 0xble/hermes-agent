name: Install and update E2E

# Expensive real-toolchain coverage is manual-only. The default is one update
# from the newest canonical release. Full mode opts into both update routes
# across a release spread.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Coverage size.
        required: true
        type: choice
        default: smoke
        options: [smoke, full]
      tag-count:
        description: Release count for full mode (newest, oldest, and spread).
        required: false
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: install-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pick-releases:
    name: Pick canonical release tags
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          filter: blob:none
          fetch-tags: false
          persist-credentials: false
          sparse-checkout: scripts/sandbox/pick-release-tags.sh
          sparse-checkout-cone-mode: false
      - name: Fetch canonical release tags
        run: |
          set -euo pipefail
          git fetch --force --no-tags --filter=blob:none \
            https://github.com/NousResearch/hermes-agent.git \
            '+refs/tags/v*:refs/tags/v*'
      - id: pick
        env:
          TAG_COUNT: ${{ inputs.mode == 'full' && inputs.tag-count || '1' }}
        run: |
          set -euo pipefail
          tags="$(scripts/sandbox/pick-release-tags.sh --count "$TAG_COUNT")"
          echo "Testing updates from: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  update:
    needs: pick-releases
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        install-ref: ${{ fromJSON(needs.pick-releases.outputs.tags) }}
    uses: ./.github/workflows/install-e2e-run.yml
    with:
      route: update
      install-ref: ${{ matrix.install-ref }}

  installer:
    if: inputs.mode == 'full'
    needs: pick-releases
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        install-ref: ${{ fromJSON(needs.pick-releases.outputs.tags) }}
    uses: ./.github/workflows/install-e2e-run.yml
    with:
      route: installer
      install-ref: ${{ matrix.install-ref }}
