        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: gate-harness
          persist-credentials: false
      - run: mv gate-harness "$RUNNER_TEMP/gate-harness"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
