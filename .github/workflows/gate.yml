      - name: Install upstream-pinned ripgrep
        run: |
          version=15.1.0
          archive="ripgrep-${version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/BurntSushi/ripgrep/releases/download/${version}/$archive"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/ripgrep-${version}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
      - name: Set up candidate-owned locked PM and test environment
        if: needs.plan.outputs.mode == 'upstream'
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain", "messaging"]'
          test-environment: 'true'
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'
      - name: Expose candidate PM test environment at the required upgrade path
        run: |
          test ! -e .venv
          ln -s "$(dirname "$(dirname "$HERMES_PYTHON")")" .venv
          test -x .venv/bin/python
