        run: '"$HERMES_PYTHON" -c "import sqlite3, hermes_state_wal as w; print(sqlite3.sqlite_version); assert not w.is_sqlite_wal_reset_vulnerable()"'
      - name: Full candidate-owned Python suite (all slices required)
        env:
          HERMES_TEST_SLICE: ${{ matrix.shard }}/10
          HERMES_TEST_WORKERS: '4'
          HERMES_TEST_FILE_TIMEOUT: '600'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
        run: scripts/run_tests.sh
      - name: Assert unchanged exact candidate source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git diff --exit-code
          git diff --cached --exit-code
  upstream-e2e:
