name: Trusted fork policy

# GitHub reads pull_request_target workflows from the default branch. Candidate
# content is checkout data only; every command below addresses trusted-policy.
on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate candidate with trusted policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-policy
          persist-credentials: false
      - name: Checkout immutable candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Assess maintenance inventory (advisory)
        continue-on-error: true
        run: >-
          python3 trusted-policy/scripts/validate_maintenance_manifest.py
          candidate/MAINTENANCE.md --json
      - name: Install pinned uv for trusted workflow policy
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.28"
      - name: Validate candidate workflow security with trusted code
        run: >-
          uv run --script trusted-policy/scripts/ci/validate_workflow_policy.py
          --root candidate --trusted-root trusted-policy
