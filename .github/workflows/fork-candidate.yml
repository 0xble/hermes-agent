name: Fork candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests
    uses: ./.github/workflows/tests.yml
    with:
      slice_count: 12

  lint:
    name: Python lints
    uses: ./.github/workflows/lint.yml
    with:
      event_name: push

  verified:
    name: Candidate verified
    if: always()
    needs: [tests, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          set -euo pipefail
          printf 'tests=%s\nlint=%s\n' "$TESTS_RESULT" "$LINT_RESULT"
          test "$TESTS_RESULT" = success
          test "$LINT_RESULT" = success
