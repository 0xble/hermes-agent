name: Fork CI

# Every PR runs a cheap fast gate and provisioned affected-area jobs. Shared runtime,
# security, dependency, packaging, platform, and CI changes additionally run
# the broader hosted matrix. The weekly and manual routes run that matrix too.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  actions: read
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Fast correctness and portability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.classify.outputs.python }}
      frontend: ${{ steps.classify.outputs.frontend }}
      site: ${{ steps.classify.outputs.site }}
      installer: ${{ steps.classify.outputs.installer }}
      rust: ${{ steps.classify.outputs.rust }}
      docker_meta: ${{ steps.classify.outputs.docker_meta }}
      uv_lock: ${{ steps.classify.outputs.uv_lock }}
      scan: ${{ steps.classify.outputs.scan }}
      deps: ${{ steps.classify.outputs.deps }}
      lock_scan: ${{ steps.classify.outputs.lock_scan }}
      risk_full: ${{ steps.classify.outputs.risk_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: classify
        name: Detect affected areas
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}
      - name: Install pinned uv for local checks
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.28"
      - name: Run fast checks
        run: |
          base=HEAD
          if [ "${{ github.event_name }}" = pull_request ]; then base=HEAD^1; fi
          python3 scripts/ci/local_check.py --profile smoke --base "$base"

  history:
    name: Require a common ancestor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject unrelated histories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null || {
            echo "::error::This PR has no common ancestor with its base branch. Rebase it onto current main before merging."
            exit 1
          }

  tests:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.python == 'true' || needs.smoke.outputs.risk_full == 'true'
    uses: ./.github/workflows/tests.yml

  tests-os:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.risk_full == 'true'
    uses: ./.github/workflows/tests-os.yml
    with:
      desktop_updater: ${{ needs.smoke.outputs.risk_full == 'true' }}

  lint:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.python == 'true' || needs.smoke.outputs.risk_full == 'true'
    uses: ./.github/workflows/lint.yml

  js-tests:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.frontend == 'true'
    uses: ./.github/workflows/js-tests.yml

  installer-tests:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.installer == 'true'
    uses: ./.github/workflows/installer-tests.yml

  rust-tests:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml

  docs-site:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.site == 'true'
    uses: ./.github/workflows/docs-site-checks.yml

  uv-lockfile:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.uv_lock == 'true'
    uses: ./.github/workflows/uv-lockfile-check.yml

  docker-lint:
    needs: smoke
    if: github.event_name != 'pull_request' || needs.smoke.outputs.docker_meta == 'true'
    uses: ./.github/workflows/docker-lint.yml

  supply-chain:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.smoke.outputs.scan == 'true' || needs.smoke.outputs.deps == 'true'))
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      scan: ${{ needs.smoke.outputs.scan == 'true' }}
      deps: ${{ needs.smoke.outputs.deps == 'true' }}

  osv-scanner:
    needs: smoke
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.smoke.outputs.lock_scan == 'true')
    uses: ./.github/workflows/osv-scanner.yml

  result:
    name: CI result
    needs: [smoke, history, tests, tests-os, lint, js-tests, installer-tests, rust-tests, docs-site, uv-lockfile, docker-lint, supply-chain, osv-scanner]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report required job outcomes
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['NEEDS'])
          outputs = needs.get('smoke', {}).get('outputs', {})
          full = os.environ['EVENT'] != 'pull_request'
          broad = full or outputs.get('risk_full') == 'true'
          expected = {'smoke'}
          if os.environ['EVENT'] == 'pull_request':
              expected.add('history')
          if broad or outputs.get('python') == 'true':
              expected.update(('tests', 'lint'))
          if broad:
              expected.add('tests-os')
          for job, lane in {'js-tests': 'frontend', 'installer-tests': 'installer', 'rust-tests': 'rust', 'docs-site': 'site', 'uv-lockfile': 'uv_lock', 'docker-lint': 'docker_meta'}.items():
              if full or outputs.get(lane) == 'true':
                  expected.add(job)
          manual = os.environ['EVENT'] == 'workflow_dispatch'
          if manual or (os.environ['EVENT'] == 'pull_request' and (outputs.get('scan') == 'true' or outputs.get('deps') == 'true')):
              expected.add('supply-chain')
          if manual or (os.environ['EVENT'] == 'pull_request' and outputs.get('lock_scan') == 'true'):
              expected.add('osv-scanner')
          problems = {name: needs.get(name, {}).get('result', 'missing') for name in sorted(expected) if needs.get(name, {}).get('result') != 'success'}
          unexpected = {name: item.get('result') for name, item in needs.items() if item.get('result') in ('failure', 'cancelled')}
          problems.update(unexpected)
          if problems:
              print('Required CI jobs did not pass:', json.dumps(problems, sort_keys=True))
              print('Inspect the named job: test failures are correctness findings; setup/download failures are infrastructure errors. Neither is a successful check.')
              sys.exit(1)
          print('All required correctness checks passed; unaffected jobs were skipped.')
          PY
