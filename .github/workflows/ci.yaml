name: Fork CI

# Economical private-mirror orchestrator. The classifier runs once and calls
# only checks that the changed paths can affect. Contributor governance,
# publication, and live PR-comment automation are intentionally absent.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      python: ${{ steps.classify.outputs.python }}
      python_prod: ${{ steps.classify.outputs.python_prod }}
      frontend: ${{ steps.classify.outputs.frontend }}
      site: ${{ steps.classify.outputs.site }}
      scan: ${{ steps.classify.outputs.scan }}
      deps: ${{ steps.classify.outputs.deps }}
      uv_lock: ${{ steps.classify.outputs.uv_lock }}
      npm_lock: ${{ steps.classify.outputs.npm_lock }}
      installer: ${{ steps.classify.outputs.installer }}
      rust: ${{ steps.classify.outputs.rust }}
      docker_meta: ${{ steps.classify.outputs.docker_meta }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}


  tests:
    name: Python tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/tests.yml

  tests-os:
    name: OS-specific tests
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/tests-os.yml

  lint:
    name: Python static checks
    needs: detect
    if: needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/lint.yml

  js-tests:
    name: JS and TS checks
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/js-tests.yml

  installer-tests:
    name: Installer tests
    needs: detect
    if: needs.detect.outputs.installer == 'true'
    uses: ./.github/workflows/installer-tests.yml

  rust-tests:
    name: Rust tests
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml

  docs-site:
    name: Docs site
    needs: detect
    if: needs.detect.outputs.site == 'true'
    uses: ./.github/workflows/docs-site-checks.yml

  history-check:
    name: Deny unrelated histories
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request'
    uses: ./.github/workflows/history-check.yml

  uv-lockfile:
    name: Check uv.lock
    needs: detect
    if: needs.detect.outputs.uv_lock == 'true'
    uses: ./.github/workflows/uv-lockfile-check.yml

  lockfile-diff:
    name: package-lock.json diff
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && needs.detect.outputs.npm_lock == 'true'
    uses: ./.github/workflows/lockfile-diff.yml

  docker-lint:
    name: Lint Docker inputs
    needs: detect
    if: needs.detect.outputs.docker_meta == 'true'
    uses: ./.github/workflows/docker-lint.yml

  supply-chain:
    name: Supply-chain checks
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && (needs.detect.outputs.scan == 'true' || needs.detect.outputs.deps == 'true')
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}

  osv-scanner:
    name: OSV dependency scan
    needs: detect
    if: needs.detect.outputs.uv_lock == 'true' || needs.detect.outputs.npm_lock == 'true'
    uses: ./.github/workflows/osv-scanner.yml

  all-checks-pass:
    name: All required checks pass
    needs:
      - detect
      - tests
      - tests-os
      - lint
      - js-tests
      - installer-tests
      - rust-tests
      - docs-site
      - history-check
      - uv-lockfile
      - lockfile-diff
      - docker-lint
      - supply-chain
      - osv-scanner
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = {
              name: value["result"]
              for name, value in needs.items()
              if value["result"] not in {"success", "skipped"}
          }
          for name, value in sorted(needs.items()):
              print(f"{name}: {value['result']}")
          if failed:
              print(f"::error::{len(failed)} required job(s) did not pass: {failed}")
              sys.exit(1)
          PY
