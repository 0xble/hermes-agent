name: Fork promotion

on:
  workflow_run:
    workflows: ["Fork candidate"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: fork-promotion
  cancel-in-progress: false

jobs:
  promote-candidate:
    if: >-
      github.event.workflow_run.name == 'Fork candidate' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/candidate/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RESULT: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Check out verified candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Promote exact verified SHA
        run: |
          set -euo pipefail
          base_sha=${HEAD_BRANCH##*/}
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Candidate branch does not encode a full base SHA: $HEAD_BRANCH" >&2
            exit 1
          fi

          remote_main=$(git ls-remote --heads origin refs/heads/main | cut -f1)
          remote_candidate=$(git ls-remote --heads origin "refs/heads/$HEAD_BRANCH" | cut -f1)

          if [ "$remote_candidate" != "$HEAD_SHA" ]; then
            echo "Ignoring superseded candidate $HEAD_SHA; remote candidate is $remote_candidate"
            exit 0
          fi

          if [ "$RESULT" != success ]; then
            body=$(printf "Candidate \`%s\` did not pass fork verification.\n\n- Expected fork main: \`%s\`\n- Result: \`%s\`\n- Run: %s\n\n\`main\` was not changed." "$HEAD_SHA" "$base_sha" "$RESULT" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            issue=$(gh issue list --state open --search '"Fork maintenance blocked" in:title' --json number --jq ".[0].number // empty")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "Fork maintenance blocked" --body "$body" --label "bug" || gh issue create --title "Fork maintenance blocked" --body "$body"
            fi
            exit 1
          fi

          if [ "$remote_main" != "$base_sha" ]; then
            body=$(printf "Verified candidate \`%s\` was not promoted because fork \`main\` changed during verification.\n\n- Expected: \`%s\`\n- Actual: \`%s\`\n- Run: %s" "$HEAD_SHA" "$base_sha" "$remote_main" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            issue=$(gh issue list --state open --search '"Fork maintenance blocked" in:title' --json number --jq ".[0].number // empty")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "Fork maintenance blocked" --body "$body" --label "bug" || gh issue create --title "Fork maintenance blocked" --body "$body"
            fi
            exit 1
          fi

          git push --force-with-lease="refs/heads/main:$base_sha" origin "$HEAD_SHA:refs/heads/main"
          git push --force-with-lease="refs/heads/$HEAD_BRANCH:$HEAD_SHA" origin ":refs/heads/$HEAD_BRANCH"

          issue=$(gh issue list --state open --search '"Fork maintenance blocked" in:title' --json number --jq ".[0].number // empty")
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Fork candidate $HEAD_SHA passed verification and was promoted to main."
          fi

          remote_main_after=$(git ls-remote --heads origin refs/heads/main | cut -f1)
          test "$remote_main_after" = "$HEAD_SHA"
          echo "Promoted verified fork candidate $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
