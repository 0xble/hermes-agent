name: Python static checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # 10.0.1
        with:
          version: "0.9.28"
      - name: Install Ruff
        uses: ./.github/actions/retry
        with:
          command: uv tool install ruff
      - name: Run Ruff
        run: ruff check .

  windows-footguns:
    name: Windows footguns
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run static portability guard
        run: python3 scripts/check-windows-footguns.py --all
