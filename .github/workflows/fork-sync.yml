name: Fork sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  prepare-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out maintained main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase patches onto current upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016,SC2129
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --prune upstream main

          base_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse upstream/main)
          {
            echo "base_sha=$base_sha"
            echo "upstream_sha=$upstream_sha"
          } >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            {
              echo "candidate_sha=$base_sha"
              echo "changed=false"
            } >> "$GITHUB_OUTPUT"
            echo "Fork already contains upstream $upstream_sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! rebase_output=$(git rebase upstream/main 2>&1); then
            git rebase --abort || true
            printf '%s\n' "$rebase_output"
            body=$(printf "Automated fork synchronization could not rebase the maintained patch stack.\n\n- Fork base: \`%s\`\n- Upstream: \`%s\`\n- Run: %s\n\nNo candidate was published and \`main\` was not changed." "$base_sha" "$upstream_sha" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
            # shellcheck disable=SC2016
            issue=$(gh issue list --state open --search '"Fork maintenance blocked" in:title' --json number --jq ".[0].number // empty")
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "$body"
            else
              gh issue create --title "Fork maintenance blocked" --body "$body" --label "bug" || gh issue create --title "Fork maintenance blocked" --body "$body"
            fi
            exit 1
          fi

          # MAINTENANCE.md is the single patch registry. Validate its record
          # shape, require every active stable subject exactly once, and reject
          # fork-only code commits that are absent from the registry.
          python - upstream/main HEAD <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          import subprocess
          import sys

          base, head = sys.argv[1:]
          manifest = Path("MAINTENANCE.md").read_text()
          index = manifest.split("## Maintained patch index", 1)[1].split(
              "## Patch records", 1
          )[0]
          rows = []
          for line in index.splitlines():
              if not line.startswith("| HERMES-"):
                  continue
              cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
              patch_id, status, subject_cell = cells[:3]
              subjects = re.findall(r"`([^`]+)`", subject_cell)
              if status not in {"Active", "Retired"} or not subjects:
                  raise SystemExit(f"Invalid manifest row: {line}")
              rows.append((patch_id, status, subjects))

          record_ids = re.findall(r"(?m)^### (HERMES-\d{3})\b", manifest)
          index_ids = [patch_id for patch_id, _, _ in rows]
          if len(index_ids) != len(set(index_ids)):
              raise SystemExit(f"Duplicate manifest patch ID: {index_ids!r}")
          if Counter(index_ids) != Counter(record_ids):
              raise SystemExit(
                  "Manifest index/record mismatch: "
                  f"index={index_ids!r} records={record_ids!r}"
              )

          for patch_id in record_ids:
              body = manifest.split(f"### {patch_id}", 1)[1].split("\n### ", 1)[0]
              for field in (
                  "**Summary:**",
                  "**Surfaces:**",
                  "**Upstream tracking:**",
                  "**Regression:**",
                  "**Rollback:**",
              ):
                  if field not in body:
                      raise SystemExit(f"{patch_id} is missing {field}")

          active_subjects = list(
              dict.fromkeys(
                  subject
                  for _, status, subjects in rows
                  if status == "Active"
                  for subject in subjects
              )
          )
          known_subjects = {
              subject for _, _, subjects in rows for subject in subjects
          }
          log = subprocess.check_output(
              ["git", "log", "--format=%H%x09%s", f"{base}..{head}"],
              text=True,
          ).splitlines()
          subject_counts = Counter(line.split("\t", 1)[1] for line in log)
          for subject in active_subjects:
              count = subject_counts[subject]
              if count != 1:
                  raise SystemExit(
                      f"Active maintained subject must appear exactly once: "
                      f"{subject!r} count={count}"
                  )

          code_suffixes = {
              ".c", ".cc", ".cpp", ".cs", ".css", ".go", ".h", ".hpp",
              ".html", ".java", ".js", ".json", ".jsx", ".kt", ".kts",
              ".php", ".py", ".rb", ".rs", ".scss", ".sh", ".sql",
              ".svelte", ".swift", ".toml", ".ts", ".tsx", ".vue", ".yaml",
              ".yml",
          }
          for line in log:
              commit, subject = line.split("\t", 1)
              paths = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", commit],
                  text=True,
              ).splitlines()
              if any(Path(path).suffix in code_suffixes for path in paths):
                  if subject not in known_subjects:
                      raise SystemExit(
                          f"Fork-only code commit is missing from the manifest: "
                          f"{commit} {subject}"
                      )
          PY

          candidate_sha=$(git rev-parse HEAD)
          candidate_branch="automation/candidate/$base_sha"
          remote_candidate=""
          read -r remote_candidate _ < <(git ls-remote --heads origin "refs/heads/$candidate_branch") || true
          if [ -n "$remote_candidate" ]; then
            lease="--force-with-lease=refs/heads/$candidate_branch:$remote_candidate"
          else
            lease="--force-with-lease=refs/heads/$candidate_branch:"
          fi
          git push "$lease" origin "HEAD:refs/heads/$candidate_branch"
          gh workflow run fork-candidate.yml --ref "$candidate_branch"

          {
            echo "candidate_sha=$candidate_sha"
            echo "candidate_branch=$candidate_branch"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Published candidate \`$candidate_sha\`"
            echo
            echo "Upstream base: \`$upstream_sha\`"
            echo
            echo "Expected fork main: \`$base_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"
