name: Display Writer Hold Evidence
on:
  push:
    branches: [perf/db-lock-hold-evidence]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7d35c993a93f681dcd42a83195c539cd82b918fd
          fetch-depth: 3
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.12.13'
      - name: Prepare isolated test environment
        run: |
          export TMPDIR="$RUNNER_TEMP/display-fold-scratch"
          export HERMES_HOME="$RUNNER_TEMP/hermes-test-home"
          mkdir -p "$TMPDIR" "$HERMES_HOME"
          printf 'TMPDIR=%s\nHERMES_HOME=%s\n' "$TMPDIR" "$HERMES_HOME" >> "$GITHUB_ENV"
          uv python install 3.14.7
          uv run --no-project --python 3.14.7 python -m pm.build_env --source . --out .venv --group dev --group test
      - name: State regression suite
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: scripts/run_tests.sh tests/hermes_state -q
      - name: Load benchmark smoke
        if: always()
        run: .venv/bin/python scripts/bench_display_writer_hold.py --baseline 82cfb861e2b6487c7b92f0fef4b3d7780a599572 --rows 40 --rounds 1 --output evidence/smoke.json
      - name: Alternating 100-pair load benchmark
        if: always()
        run: .venv/bin/python scripts/bench_display_writer_hold.py --baseline 82cfb861e2b6487c7b92f0fef4b3d7780a599572 --rows 400 --rounds 100 --output evidence/p99.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: display-writer-hold-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
