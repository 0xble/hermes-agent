name: Supply-chain checks

# Fork-relevant, blocking checks only. No contributor governance, labels,
# comments, or privileged credentials.
on:
  workflow_call:
    inputs:
      scan:
        description: Whether executable or install-time Python files changed.
        type: boolean
        required: true
      deps:
        description: Whether pyproject.toml changed.
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  critical-patterns:
    name: Critical supply-chain patterns
    if: inputs.scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout submitted history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Scan added code
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          diff=$(git diff "$BASE"..."$HEAD" -- . ':!uv.lock' ':!*.lock' ':!package-lock.json' ':!yarn.lock' || true)
          findings=""

          pth_files=$(git diff --diff-filter=d --name-only "$BASE"..."$HEAD" | grep '\.pth$' || true)
          [ -z "$pth_files" ] || findings="${findings}\nPython .pth file changed:\n${pth_files}"

          b64_exec=$(printf '%s\n' "$diff" | grep -n '^+' | grep -iE 'base64\.(b64decode|decodebytes|urlsafe_b64decode)' | grep -iE 'exec\(|eval\(' | head -10 || true)
          [ -z "$b64_exec" ] || findings="${findings}\nbase64 decode plus exec/eval:\n${b64_exec}"

          proc_obfuscation=$(printf '%s\n' "$diff" | grep -n '^+' | grep -E 'subprocess\.(Popen|call|run)\s*\(' | grep -iE 'base64|\\x[0-9a-f]{2}|chr\(' | head -10 || true)
          [ -z "$proc_obfuscation" ] || findings="${findings}\nobfuscated subprocess command:\n${proc_obfuscation}"

          install_hooks=$(git diff --diff-filter=d --name-only "$BASE"..."$HEAD" | grep -E '^(setup\.py|setup\.cfg|sitecustomize\.py|usercustomize\.py|__init__\.pth)$' || true)
          [ -z "$install_hooks" ] || findings="${findings}\ninstall/startup hook changed:\n${install_hooks}"

          if [ -n "$findings" ]; then
            printf '::error::Critical supply-chain pattern detected.%b\n' "$findings"
            exit 1
          fi

  dependency-bounds:
    name: PyPI dependency upper bounds
    if: inputs.deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout submitted history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Reject newly unbounded dependencies
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          added=$(git diff "$BASE"..."$HEAD" -- pyproject.toml | grep '^+' | grep -v '^+++' || true)
          unbounded=$(printf '%s\n' "$added" | grep -oE '"[a-zA-Z0-9_-]+(\[[^]]*\])?>=[ 0-9.]+"' | grep -v ',<' || true)
          if [ -n "$unbounded" ]; then
            echo "::error::New PyPI dependencies require an upper bound:"
            printf '%s\n' "$unbounded"
            exit 1
          fi
