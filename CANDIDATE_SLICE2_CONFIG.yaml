# Hermes Agent Next Slice 2 candidate profile configuration
#
# This is a credential-free example. Copy it into a disposable HERMES_HOME
# only after supplying authorized provider credentials through that profile.
# It must never be used as the production profile without the Slice 2
# behavioral and restart tests.

model:
  default: anthropic/claude-fable-5.1
  provider: anthropic
fallback_providers:
  - provider: openai-codex
    model: gpt-6-astra
  - provider: anthropic
    model: claude-opus-5
agent:
  reasoning_effort: medium
delegation:
  provider: openai-codex
  model: gpt-6-astra
  reasoning_effort: high
  max_spawn_depth: 2
  max_concurrent_children: 10
  fallback_providers:
    - provider: anthropic
      model: claude-opus-5
auxiliary:
  review:
    provider: anthropic
    model: claude-fable-5.1
updates:
  check: false
plugins:
  enabled:
    - canonical-skill-guard
